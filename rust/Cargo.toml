[workspace]
resolver = "2"
members = [
    "crates/watcher",
    "crates/scanner",
    "crates/parsers",
    "crates/storage",
    "crates/mcp",
    "crates/runtime",
    "crates/ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
notify = "6"
walkdir = "2"
ignore = "0.4"
rusqlite = "0.32"
uuid = { version = "1", features = ["v5"] }
sha2 = "0.10"
sha1 = "0.10"
md5 = "0.7"
blake2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1"
signal-hook = "0.3"
serde_yaml = "0.9"
globset = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
