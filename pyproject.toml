[project]
name = "cortex-agent"
version = "0.1.0"
description = "Cortex MCP Agent — Semantic Code Intelligence Engine"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.2.0",
    "huggingface-hub>=0.20.0",
    "torch==2.5.1",
]

[project.optional-dependencies]
gpu-accel = [
    # Linux 전용 optional extra — 기본 설치/평가 실행에서는 설치하지 않는다.
    "flash-attn==2.8.3 ; sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[tool.pytest.ini_options]
markers = [
    "smoke: end-to-end smoke tests that start subprocesses or exercise MCP stdio",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["cortex*"]

[tool.uv]
default-groups = []

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
